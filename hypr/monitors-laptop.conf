# See https://wiki.hypr.land/Configuring/Basics/Monitors/
# Format: monitor = [port], resolution, position, scale
#
# Equipo: ASUS ROG Zephyrus G14 GA403UV — específico de esta laptop.
# No aplicar en el PC de escritorio (ver hypr/monitors-desktop.conf para ese equipo).
#
# === Especificaciones de la pantalla integrada (eDP) ===
# Panel:            Samsung Display Corp. ATNA40CU05-0 (SDC419C)
# Nombre comercial: ASUS ROG Nebula Display
# Tamaño:           14"  (300 x 190 mm de área activa)
# Resolución:       2880 x 1800 (3K / 2.8K), formato 16:10
# Tasa de refresco:  hasta 120Hz
# Tipo de panel:    OLED
# Tiempo de resp.:  0.2ms
# Color:            100% DCI-P3, Pantone Validated
# Recubrimiento:    Anti-glare / low-reflection
# Táctil:           No
# Sync GPU:         NVIDIA G-Sync (soporta MUX Switch + NVIDIA Advanced Optimus)
# Interfaz:         eDP, 40-pin

# Monitor externo (DP-1) como pantalla principal a la izquierda
monitor = DP-1, 5120x1440@120, 0x0, 1

# Configuración por defecto para la pantalla de la laptop (eDP-2 / eDP-1)
# bitdepth 10 = elimina banding en gradientes (el panel OLED lo soporta)
# cm edid = usa la gama de color nativa del panel (DCI-P3 ancho) en vez de clamping a sRGB
# vrr 2 = VRR activo solo en apps a pantalla completa (evita flicker de VRR en OLED en el escritorio)
# Nota: HDR (cm hdr) aún no se activa — libdisplay-info 0.3.0 (versión en Arch a la fecha)
# no lee los metadatos HDR de este panel (van en un bloque DisplayID 2.0, soportado desde 0.4.0).
monitor = eDP-2, preferred, auto, 2, bitdepth, 10, cm, edid, vrr, 2
monitor = eDP-1, preferred, auto, 2, bitdepth, 10, cm, edid, vrr, 2

# Fallback para cualquier otro monitor
monitor = , preferred, auto, auto
