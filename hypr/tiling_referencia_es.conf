# ==============================================================================
# Guía Descriptiva en Español: Atajos del Sistema Hyprland / Omarchy (tiling-v2)
# Archivo de consulta y referencia: ~/.config/hypr/tiling_referencia_es.conf
# ==============================================================================

# --- Cerrar Ventanas ---
# Cierra inmediatamente la ventana que tengas enfocada en ese momento.
bindd = SUPER, W, Cerrar ventana, killactive,

# Cierra todas las ventanas abiertas en todos los escritorios de una sola vez.
bindd = CTRL ALT, DELETE, Cerrar todas las ventanas, exec, omarchy-hyprland-window-close-all

# --- Control de Ventanas y Mosaico ---
# Cambia el sentido de división al abrir nuevas ventanas (alterna entre dividir en horizontal o en vertical).
bindd = SUPER, J, Alternar división de ventana, layoutmsg, togglesplit

# Manten la ventana dentro de la cuadrícula, pero sin estirarla: conserva su tamaño/proporción natural en lugar de llenar todo el espacio asignado.
bindd = SUPER, P, Ventana pseudoflotante, pseudo,

# Desconecta la ventana de la cuadrícula rígida para moverla y ajustarla libremente con el ratón sobre las demás (como en Windows o macOS).
bindd = SUPER, T, Alternar flotante/mosaico, togglefloating,

# Modos de pantalla completa:
# Expandir la ventana al 100% de la pantalla, ocultando la barra superior y los bordes.
bindd = SUPER, F, Pantalla completa, fullscreen, 0

# Maximizar dentro de su propia celda: la ventana ocupa todo el espacio de su casilla de mosaico sin salirse de ella.
bindd = SUPER CTRL, F, Pantalla completa en mosaico, fullscreenstate, 0 2

# Maximizar manteniendo la barra de estado superior (Waybar) y los bordes visibles.
bindd = SUPER ALT, F, Ancho completo, fullscreen, 1

# Saca la ventana de la cuadrícula, la vuelve flotante y la fija arriba (Pin) para que siempre permanezca sobre las demás.
bindd = SUPER, O, Desacoplar ventana, exec, omarchy-hyprland-window-pop

# Cambia el algoritmo de organización de ventanas del escritorio (por ejemplo: espiral, columnas o cuadrícula).
bindd = SUPER, L, Alternar diseño del escritorio, exec, omarchy-hyprland-workspace-layout-toggle

# --- Mover Enfoque (Cursor y Selección) con Flechas ---
# Mueve la selección de teclado/mouse a la ventana situada inmediatamente a la izquierda.
bindd = SUPER, LEFT, Enfocar ventana izquierda, movefocus, l

# Mueve la selección a la ventana situada inmediatamente a la derecha.
bindd = SUPER, RIGHT, Enfocar ventana derecha, movefocus, r

# Mueve la selección a la ventana situada arriba.
bindd = SUPER, UP, Enfocar ventana arriba, movefocus, u

# Mueve la selección a la ventana situada abajo.
bindd = SUPER, DOWN, Enfocar ventana abajo, movefocus, d

# --- Cambiar de Escritorio Virtual (Workspaces 1 al 10) ---
# Cambia tu vista actual al Escritorio 1
bindd = SUPER, code:10, Ir al escritorio 1, workspace, 1
# Cambia tu vista actual al Escritorio 2
bindd = SUPER, code:11, Ir al escritorio 2, workspace, 2
# Cambia tu vista actual al Escritorio 3
bindd = SUPER, code:12, Ir al escritorio 3, workspace, 3
# Cambia tu vista actual al Escritorio 4
bindd = SUPER, code:13, Ir al escritorio 4, workspace, 4
# Cambia tu vista actual al Escritorio 5
bindd = SUPER, code:14, Ir al escritorio 5, workspace, 5
# Cambia tu vista actual al Escritorio 6
bindd = SUPER, code:15, Ir al escritorio 6, workspace, 6
# Cambia tu vista actual al Escritorio 7
bindd = SUPER, code:16, Ir al escritorio 7, workspace, 7
# Cambia tu vista actual al Escritorio 8
bindd = SUPER, code:17, Ir al escritorio 8, workspace, 8
# Cambia tu vista actual al Escritorio 9
bindd = SUPER, code:18, Ir al escritorio 9, workspace, 9
# Cambia tu vista actual al Escritorio 10
bindd = SUPER, code:19, Ir al escritorio 10, workspace, 10

# --- Mover Ventana Activa a un Escritorio ---
# Mueve la ventana activa al Escritorio 1 y cambia tu vista junto con ella.
bindd = SUPER SHIFT, code:10, Mover ventana al escritorio 1, movetoworkspace, 1
# Mueve la ventana activa al Escritorio 2 y te lleva allí.
bindd = SUPER SHIFT, code:11, Mover ventana al escritorio 2, movetoworkspace, 2
# Mueve la ventana activa al Escritorio 3 y te lleva allí.
bindd = SUPER SHIFT, code:12, Mover ventana al escritorio 3, movetoworkspace, 3
# Mueve la ventana activa al Escritorio 4 y te lleva allí.
bindd = SUPER SHIFT, code:13, Mover ventana al escritorio 4, movetoworkspace, 4
# Mueve la ventana activa al Escritorio 5 y te lleva allí.
bindd = SUPER SHIFT, code:14, Mover ventana al escritorio 5, movetoworkspace, 5
# Mueve la ventana activa al Escritorio 6 y te lleva allí.
bindd = SUPER SHIFT, code:15, Mover ventana al escritorio 6, movetoworkspace, 6
# Mueve la ventana activa al Escritorio 7 y te lleva allí.
bindd = SUPER SHIFT, code:16, Mover ventana al escritorio 7, movetoworkspace, 7
# Mueve la ventana activa al Escritorio 8 y te lleva allí.
bindd = SUPER SHIFT, code:17, Mover ventana al escritorio 8, movetoworkspace, 8
# Mueve la ventana activa al Escritorio 9 y te lleva allí.
bindd = SUPER SHIFT, code:18, Mover ventana al escritorio 9, movetoworkspace, 9
# Mueve la ventana activa al Escritorio 10 y te lleva allí.
bindd = SUPER SHIFT, code:19, Mover ventana al escritorio 10, movetoworkspace, 10

# --- Mover Ventana Silenciosamente a un Escritorio ---
# Mueve la ventana al Escritorio 1 en segundo plano, manteniéndote en tu escritorio actual.
bindd = SUPER SHIFT ALT, code:10, Mover silenciosamente al escritorio 1, movetoworkspacesilent, 1
# Mueve la ventana al Escritorio 2 en segundo plano.
bindd = SUPER SHIFT ALT, code:11, Mover silenciosamente al escritorio 2, movetoworkspacesilent, 2
# Mueve la ventana al Escritorio 3 en segundo plano.
bindd = SUPER SHIFT ALT, code:12, Mover silenciosamente al escritorio 3, movetoworkspacesilent, 3
# Mueve la ventana al Escritorio 4 en segundo plano.
bindd = SUPER SHIFT ALT, code:13, Mover silenciosamente al escritorio 4, movetoworkspacesilent, 4
# Mueve la ventana al Escritorio 5 en segundo plano.
bindd = SUPER SHIFT ALT, code:14, Mover silenciosamente al escritorio 5, movetoworkspacesilent, 5
# Mueve la ventana al Escritorio 6 en segundo plano.
bindd = SUPER SHIFT ALT, code:15, Mover silenciosamente al escritorio 6, movetoworkspacesilent, 6
# Mueve la ventana al Escritorio 7 en segundo plano.
bindd = SUPER SHIFT ALT, code:16, Mover silenciosamente al escritorio 7, movetoworkspacesilent, 7
# Mueve la ventana al Escritorio 8 en segundo plano.
bindd = SUPER SHIFT ALT, code:17, Mover silenciosamente al escritorio 8, movetoworkspacesilent, 8
# Mueve la ventana al Escritorio 9 en segundo plano.
bindd = SUPER SHIFT ALT, code:18, Mover silenciosamente al escritorio 9, movetoworkspacesilent, 9
# Mueve la ventana al Escritorio 10 en segundo plano.
bindd = SUPER SHIFT ALT, code:19, Mover silenciosamente al escritorio 10, movetoworkspacesilent, 10

# --- Panel Oculto / Cajón Emergente (Scratchpad) ---
# Muestra u oculta una bandeja de ventanas flotantes especiales donde puedes guardar notas o terminales de rápido acceso.
bindd = SUPER, S, Alternar panel oculto, togglespecialworkspace, scratchpad

# Guarda la ventana que tienes enfocada directamente dentro del panel flotante oculto (Scratchpad).
bindd = SUPER ALT, S, Mover ventana al panel oculto, movetoworkspacesilent, special:scratchpad

# --- Navegación entre Escritorios ---
# Avanza al siguiente escritorio numérico disponible.
bindd = SUPER, TAB, Siguiente escritorio, workspace, e+1

# Retrocede al escritorio numérico anterior.
bindd = SUPER SHIFT, TAB, Escritorio anterior, workspace, e-1

# Vuelve al último escritorio que estabas usando anteriormente.
bindd = SUPER CTRL, TAB, Escritorio previo usado, workspace, previous

# --- Mover Escritorios Completos entre Monitores ---
# Traslada todo el escritorio activo actual al monitor conectado a la izquierda.
bindd = SUPER SHIFT ALT, LEFT, Mover escritorio al monitor izquierdo, movecurrentworkspacetomonitor, l
# Traslada todo el escritorio activo al monitor conectado a la derecha.
bindd = SUPER SHIFT ALT, RIGHT, Mover escritorio al monitor derecho, movecurrentworkspacetomonitor, r
# Traslada todo el escritorio activo al monitor conectado arriba.
bindd = SUPER SHIFT ALT, UP, Mover escritorio al monitor superior, movecurrentworkspacetomonitor, u
# Traslada todo el escritorio activo al monitor conectado abajo.
bindd = SUPER SHIFT ALT, DOWN, Mover escritorio al monitor inferior, movecurrentworkspacetomonitor, d

# --- Intercambiar Posición de Ventanas ---
# Intercambia la ubicación de la ventana actual con la ventana situada a su izquierda.
bindd = SUPER SHIFT, LEFT, Intercambiar ventana a la izquierda, swapwindow, l
# Intercambia la ubicación de la ventana actual con la ventana situada a su derecha.
bindd = SUPER SHIFT, RIGHT, Intercambiar ventana a la derecha, swapwindow, r
# Intercambia la ubicación de la ventana actual con la ventana situada arriba.
bindd = SUPER SHIFT, UP, Intercambiar ventana arriba, swapwindow, u
# Intercambia la ubicación de la ventana actual con la ventana situada abajo.
bindd = SUPER SHIFT, DOWN, Intercambiar ventana abajo, swapwindow, d

# --- Navegar entre Aplicaciones Abiertas ---
# Cambia el enfoque a la siguiente ventana abierta dentro del mismo escritorio (Alt+Tab clásico).
bindd = ALT, TAB, Enfocar siguiente ventana, cyclenext
# Cambia el enfoque a la ventana previa en el escritorio actual.
bindd = ALT SHIFT, TAB, Enfocar ventana anterior, cyclenext, prev

# --- Navegar entre Pantallas / Monitores ---
# Mover la selección del teclado y cursor al siguiente monitor físico conectado.
bindd = CTRL ALT, TAB, Enfocar siguiente monitor, focusmonitor, +1
# Mover la selección del teclado y cursor al monitor físico anterior.
bindd = CTRL ALT SHIFT, TAB, Enfocar monitor anterior, focusmonitor, -1

# --- Redimensionar Ventana Activa ---
# Ajustar el ancho horizontal de la ventana enfocada usando las teclas - e =.
bindd = SUPER, code:20, Ampliar ventana a la izquierda, resizeactive, -100 0
bindd = SUPER, code:21, Reducir ventana a la izquierda, resizeactive, 100 0

# Ajustar el alto vertical de la ventana enfocada usando Shift y teclas - e =.
bindd = SUPER SHIFT, code:20, Reducir ventana arriba, resizeactive, 0 -100
bindd = SUPER SHIFT, code:21, Ampliar ventana abajo, resizeactive, 0 100

# --- Navegación con la Rueda del Ratón ---
# Cambia al siguiente escritorio al girar la rueda del ratón hacia abajo sosteniendo la tecla SUPER.
bindd = SUPER, mouse_down, Siguiente escritorio con rueda, workspace, e+1
# Cambia al escritorio anterior al girar la rueda del ratón hacia arriba sosteniendo la tecla SUPER.
bindd = SUPER, mouse_up, Escritorio anterior con rueda, workspace, e-1

# --- Arrastrar y Mover con el Ratón ---
# Mueve libremente cualquier ventana flotante manteniendo presionada la tecla SUPER y arrastrando con Clic Izquierdo.
bindmd = SUPER, mouse:272, Mover ventana arrastrando, movewindow

# Redimensiona el tamaño de la ventana manteniendo presionada la tecla SUPER y arrastrando con Clic Derecho.
bindmd = SUPER, mouse:273, Redimensionar ventana arrastrando, resizewindow

# --- Grupos de Ventanas (Pestañas Agrupadas) ---
# Une varias ventanas en un mismo cuadro divididas por pestañas superiores (como en un navegador).
bindd = SUPER, G, Agrupar ventanas en pestañas, togglegroup

# Separa la ventana seleccionada fuera del grupo de pestañas.
bindd = SUPER ALT, G, Sacar ventana del grupo, moveoutofgroup

# Integra la ventana actual al grupo de pestañas que esté a su izquierda, derecha, arriba o abajo.
bindd = SUPER ALT, LEFT, Unir a grupo izquierdo, moveintogroup, l
bindd = SUPER ALT, RIGHT, Unir a grupo derecho, moveintogroup, r
bindd = SUPER ALT, UP, Unir a grupo superior, moveintogroup, u
bindd = SUPER ALT, DOWN, Unir a grupo inferior, moveintogroup, d

# Avanza a la siguiente pestaña dentro del grupo activo.
bindd = SUPER ALT, TAB, Siguiente pestaña de grupo, changegroupactive, f
# Retrocede a la pestaña anterior dentro del grupo activo.
bindd = SUPER ALT SHIFT, TAB, Pestaña anterior de grupo, changegroupactive, b

# --- Escalar Monitor ---
# Cambia el porcentaje de zoom / escala de la resolución del monitor de forma cíclica.
bindd = SUPER, code:61, Alternar escala de monitor, exec, omarchy-hyprland-monitor-scaling-cycle
